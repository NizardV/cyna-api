name: CI
# Vérifie chaque PR avant fusion (la pipeline de déploiement ne tourne qu'après fusion sur main/dev).
# Le job « pr-build » est une vérification obligatoire de main (protection de branche).
on: pull_request

permissions:
  contents: read

jobs:
  pr-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CynaApi.sln
      - run: dotnet build CynaApi.sln --configuration Release --no-restore
      - run: dotnet test CynaApi.sln --configuration Release --no-build
